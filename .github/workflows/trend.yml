name: trend-alert
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend-alert
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 한글 글꼴 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - run: pip install numpy pandas requests matplotlib
      - name: 추세알림 반복 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          START=$SECONDS
          while [ $((SECONDS - START)) -lt 20000 ]; do
            python trend_alert.py || echo "실행 실패"
            python touch_alert.py || echo "추세선 알림 실패"
            git add state.json || true
            git diff --cached --quiet || (git commit -m "state" && git pull --rebase --autostash && git push) || true
            sleep 600
          done
